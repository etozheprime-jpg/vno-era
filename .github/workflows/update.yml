# VNO Era: data updates + GitHub Pages deploy.
#  • push to main          → deploy the app (no API request)
#  • schedule (every 15 min) → tools/fetch-arrivals.mjs decides whether an update is due: it spreads the
#    AirLabs monthly budget evenly over the remaining days (06:30–23:45 Vilnius time), then deploys
#  • Run workflow (manual) → one update right away (owner only), then deploy
name: Update arrivals

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'   # UTC; GitHub may start it some minutes late

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.fetch.outputs.updated }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'push'

      - uses: actions/setup-node@v4
        if: github.event_name != 'push'
        with:
          node-version: 20

      - name: Fetch arrivals (AirLabs) and positions (OpenSky)
        id: fetch
        if: github.event_name != 'push'
        env:
          AIRLABS_KEY: ${{ secrets.AIRLABS_KEY }}
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          AUTO: ${{ github.event_name == 'schedule' && '1' || '' }}
          DAILY_LIMIT: 30      # hard cap on updates per day (Vilnius time), manual + automatic
          MONTHLY_LIMIT: 1000  # AirLabs Free plan requests per month
          MANUAL_RESERVE: 20   # requests the scheduler leaves for manual updates
          MAX_PAGES: 1         # schedule pages per update (Free keys: 50 results each); +1 request for live flights
        run: node tools/fetch-arrivals.mjs

      - name: Commit data
        if: steps.fetch.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/arrivals.json
          git diff --cached --quiet || git commit -m "Update arrivals data"
          git push

  deploy:
    needs: fetch
    if: github.event_name == 'push' || needs.fetch.outputs.updated == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare site
        run: |
          mkdir _site
          cp -R index.html offline.html styles.css app.js data.js map.js i18n.js sw.js manifest.webmanifest icons splash data _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="lt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VNO Era · Offline</title><meta name="theme-color" content="#070B14">
<style>
  :root { color-scheme: dark light; --bg:#070B14; --text:#F2F5FA; --muted:#A7B1C5; --accent:#8AB4FF; }
  @media (prefers-color-scheme: light) { :root { --bg:#F3F5F9; --text:#0A1222; --muted:#48536A; --accent:#2457D6; } }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; background:var(--bg); color:var(--text);
    font:16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding:24px max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left)); text-align:center; }
  img { width:96px; height:96px; border-radius:24px; }
  h1 { font-size:26px; margin:20px 0 6px; } p { color:var(--muted); margin:0 auto 24px; max-width:300px; }
  button { font:inherit; font-weight:700; min-height:52px; padding:0 28px; border:0; border-radius:16px; background:var(--accent); color:var(--bg); }
</style></head>
<body><main><img src="icons/icon-192.png" alt=""><h1 id="h">Nėra ryšio</h1><p id="p">VNO Era atnaujins atvykimus, kai tik ryšys atsiras.</p>
<button id="b" onclick="location.href='./'">Bandyti dar kartą</button></main>
<script>
  var T = { en: ['You’re offline', 'VNO Era will refresh arrivals as soon as the connection is back.', 'Try again'],
            ru: ['Нет сети', 'VNO Era обновит прилёты, как только появится связь.', 'Повторить'] };
  try { var l = (JSON.parse(localStorage.getItem('vno.settings') || '{}').lang) || 'lt';
    if (T[l]) { document.documentElement.lang = l; h.textContent = T[l][0]; p.textContent = T[l][1]; b.textContent = T[l][2]; } } catch (e) {}
  addEventListener('online', function () { location.href = './'; });
</script></body></html>

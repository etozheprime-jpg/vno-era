<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VNO Era</title>
  <meta name="description" content="Vilniaus oro uosto atvykimai: atgalinis laikmatis, keleivių išėjimo laikas, radaro žemėlapis ir skrydžių pranešimai.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#070B14" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F3F5F9" media="(prefers-color-scheme: light)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="VNO Era">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <!-- iOS splash screens -->
  <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1320x2868.png">
  <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1206x2622.png">
  <link rel="apple-touch-startup-image" media="(device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1260x2736.png">
  <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1290x2796.png">
  <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1179x2556.png">
  <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1284x2778.png">
  <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1170x2532.png">
  <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1125x2436.png">
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="splash/splash-828x1792.png">
  <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="splash/splash-750x1334.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply theme + effects level before first paint (no flash).
    try {
      var s = JSON.parse(localStorage.getItem('vno.settings') || '{}');
      if (s.theme && s.theme !== 'system') document.documentElement.dataset.theme = s.theme;
      document.documentElement.lang = s.lang || 'lt';
    } catch (e) {}
  </script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 10.2 12 3.5l8.5 6.7V19a1.5 1.5 0 0 1-1.5 1.5h-4.2v-5.8H9.2v5.8H5A1.5 1.5 0 0 1 3.5 19z"/></symbol>
      <symbol id="i-plane" viewBox="0 0 24 24"><path d="M12 1.4 13.2 2.4 13.4 9.2 21.4 13.8 21.4 15.8 13.4 13.6 13.4 18 15.8 19.6 15.8 21.2 12 20.2 8.2 21.2 8.2 19.6 10.6 18 10.6 13.6 2.6 15.8 2.6 13.8 10.6 9.2 10.8 2.4Z"/></symbol>
      <symbol id="i-land" viewBox="0 0 24 24"><path d="M3 21h18"/><path d="m4.3 9.7 1.6-.5 2.3 2.4 3.6-.8-2.6-6.6 2-.5 5 6.2 3.8-.9a1.7 1.7 0 0 1 .8 3.3L6.6 15.6a1.8 1.8 0 0 1-2-.9z"/></symbol>
      <symbol id="i-map" viewBox="0 0 24 24"><path d="M9 4 3.5 6v14L9 18l6 2 5.5-2V4L15 6z"/><path d="M9 4v14M15 6v14"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 1 1 12 0v5.5l1.6 2H4.4z"/><path d="M10 21a2.2 2.2 0 0 0 4 0"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h3M13 17h7"/><circle cx="16" cy="7" r="2.6"/><circle cx="10" cy="17" r="2.6"/></symbol>
      <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></symbol>
      <symbol id="i-open" viewBox="0 0 24 24"><path d="M7 17 17 7M8.5 7H17v8.5"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3.5v11M7.5 10 12 14.5 16.5 10M5 20h14"/></symbol>
      <symbol id="i-offline" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M8.6 16.2a5 5 0 0 1 6.2-.6M5.2 12.8a10 10 0 0 1 4-2.3M18.8 12.8a10 10 0 0 0-2.2-1.6M2 9.2a15 15 0 0 1 4-2.6M22 9.2A15 15 0 0 0 11 5"/><circle cx="12" cy="19.5" r=".9"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></symbol>
      <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
      <symbol id="i-bag" viewBox="0 0 24 24"><rect x="5.5" y="7" width="13" height="13" rx="2.5"/><path d="M9.5 7V4h5v3M9 20v1.5M15 20v1.5"/></symbol>
      <symbol id="i-passport" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2.5"/><circle cx="12" cy="10" r="3"/><path d="M9 16.5h6"/></symbol>
      <symbol id="i-exit" viewBox="0 0 24 24"><path d="M13.5 3.5H6.5a1.5 1.5 0 0 0-1.5 1.5v14a1.5 1.5 0 0 0 1.5 1.5h7"/><path d="M10 12h10.5M17.5 8.5 21 12l-3.5 3.5"/></symbol>
      <symbol id="i-cube" viewBox="0 0 24 24"><path d="M12 2.8 3.8 7.4v9.2l8.2 4.6 8.2-4.6V7.4z"/><path d="m3.8 7.4 8.2 4.6 8.2-4.6M12 12v9.2"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
      <symbol id="i-phone" viewBox="0 0 24 24"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></symbol>
      <symbol id="i-ios-share" viewBox="0 0 24 24"><path d="M12 3v11.5M8 7l4-4 4 4"/><path d="M8.5 10.5H6.5A1.5 1.5 0 0 0 5 12v8a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 20v-8a1.5 1.5 0 0 0-1.5-1.5h-2"/></symbol>
      <symbol id="i-add-square" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M12 8v8M8 12h8"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/></symbol>
      <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2.2"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/></symbol>
    </defs>
  </svg>

  <div id="app" class="is-loading">
    <header class="topbar" id="topbar">
      <div class="brand">
        <div class="brand-row">
          <span class="brand-name">VNO <b>ERA</b></span>
          <span class="live" id="live"><i></i><span>Gyvai</span></span>
        </div>
        <span class="brand-sub"><span data-i18n="brand.airport">Vilniaus oro uostas</span> · <span id="clock">--:--</span></span>
      </div>
      <button class="install-pill" id="installPill" data-action="install" hidden>
        <svg class="ic"><use href="#i-download"/></svg><span data-i18n="install">Įdiegti</span>
      </button>
    </header>

    <div class="netbar" id="netbar" role="status" aria-live="polite" hidden></div>
    <div class="ptr" id="ptr" aria-hidden="true"><svg class="ic"><use href="#i-refresh"/></svg></div>

    <main id="views">
      <section class="view" data-view="home" data-i18n-aria="tab.home"></section>
      <section class="view" data-view="arrivals" data-i18n-aria="tab.arrivals" hidden></section>
      <section class="view" data-view="map" data-i18n-aria="tab.map" hidden></section>
      <section class="view" data-view="watch" data-i18n-aria="tab.watch" hidden></section>
      <section class="view" data-view="settings" data-i18n-aria="tab.settings" hidden></section>
    </main>

    <nav class="tabbar" id="tabbar" data-i18n-aria="nav.main">
      <button data-action="go" data-tab="home" aria-current="page"><span class="tab-ic"><svg class="ic"><use href="#i-home"/></svg></span><span data-i18n="tab.home">Pradžia</span></button>
      <button data-action="go" data-tab="arrivals"><span class="tab-ic"><svg class="ic"><use href="#i-land"/></svg></span><span data-i18n="tab.arrivals">Atvykimai</span></button>
      <button data-action="go" data-tab="map"><span class="tab-ic"><svg class="ic"><use href="#i-map"/></svg></span><span data-i18n="tab.map">Žemėlapis</span></button>
      <button data-action="go" data-tab="watch"><span class="tab-ic"><svg class="ic"><use href="#i-bell"/></svg><b class="tab-badge" id="watchBadge" hidden></b></span><span data-i18n="tab.watch">Stebimi</span></button>
      <button data-action="go" data-tab="settings"><span class="tab-ic"><svg class="ic"><use href="#i-sliders"/></svg></span><span data-i18n="tab.settings">Nustatymai</span></button>
    </nav>

    <div class="sheet-backdrop" id="backdrop" data-action="close-sheet" hidden></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
      <div class="sheet-grab" id="sheetGrab"><i></i></div>
      <div class="sheet-body" id="sheetBody"></div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </div>

  <noscript><p style="padding:24px;font-family:system-ui">VNO Era reikia JavaScript, kad galėtų rodyti atvykimus.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
